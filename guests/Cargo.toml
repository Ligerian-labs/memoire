# The memoire WASM guests. A separate workspace: guests compile to
# wasm32-unknown-unknown components that import nothing, and keep their own
# lockfile. Build them with scripts/build-guests.sh.
[workspace]
resolver = "3"
members = ["catalog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The same Merezha revision as the root workspace.
merezha-domain = { git = "https://github.com/MartianGreed/merezha", rev = "556b1887b529a2c67d0699782ef6698da9fd26e1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
