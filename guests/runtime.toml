# The guests memoire ships. `memoire-gateway build --manifest guests/runtime.toml
# --workspace guests/Cargo.toml` (scripts/build-guests.sh) compiles each
# service from the package named after its id into its `path`.
version = 1

[limits]
memory_bytes = 16777216
fuel = 200000000
max_input_bytes = 262144
max_output_bytes = 262144
timeout_ms = 2000
max_concurrent_invocations = 8

[[services]]
id = "memoire-catalog"
path = "components/memoire-catalog.wasm"
# Version 2: the catalog sees the host-established principal and tenant.
application_protocol = 2
