[package]
name = "memoire-cli"
description = "The memoire command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "memoire"
path = "src/main.rs"

[dependencies]
memoire-api.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The HTTP client and timestamps the gateway's Merezha graph already builds
# (same versions and features), so the CLI adds no TLS stack of its own.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
time = { version = "0.3.55", default-features = false, features = ["std", "formatting"] }
# Reads passwords and API keys from the terminal without echo.
rpassword = "7.5.5"
# Memory ids: the version tempfile already links.
getrandom = { version = "0.4.3", default-features = false }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
rusqlite.workspace = true
merezha-postgres.workspace = true
