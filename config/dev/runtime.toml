# The gateway's WASM services. The catalog guest (guests/) joins here once
# its rules and routes land; Merezha requires the manifest either way.
version = 1

[limits]
memory_bytes = 16777216
fuel = 200000000
max_input_bytes = 262144
max_output_bytes = 262144
timeout_ms = 2000
max_concurrent_invocations = 8
